name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    strategy:
      fail-fast: false
      matrix:
        dir: [apps/agt-sidecar, apps/chaos-app, lambda]
    uses: okamyuji/reusable-workflows/.github/workflows/node-ci.yml@v1
    with:
      node-version: "24"
      working-directory: ${{ matrix.dir }}
      lint-command: run format:check
      # build runs tsc (and the bundler), so it type-checks and catches build breaks
      typecheck-command: run build
      test-command: run test

  security:
    uses: okamyuji/reusable-workflows/.github/workflows/security-scan.yml@v1
